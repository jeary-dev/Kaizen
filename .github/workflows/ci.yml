name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    name: Protocol test vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Vectors are up to date
        run: node protocol/tools/generate-vectors.mjs --check

  plugin:
    name: Plugin build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build and test
        run: ./mvnw -B -ntp verify
      - uses: actions/upload-artifact@v4
        with:
          name: Kaizen-plugin
          path: plugin/bukkit/target/Kaizen-*.jar
          if-no-files-found: error

  web:
    name: Web lint, types, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  interop:
    name: Kotlin ↔ TypeScript interop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - name: Each side opens what the other sealed
        run: node protocol/tools/interop.mjs

  browser:
    name: Editor in a real browser
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Build the standalone server
        run: |
          npm run build
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - name: Start it on 127.0.0.1:3100
        run: |
          HOSTNAME=127.0.0.1 PORT=3100 KAIZEN_PUBLIC_URL=http://localhost:3100 KAIZEN_DB_PATH="$RUNNER_TEMP/kaizen.db" \
            nohup node .next/standalone/server.js > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3100/api/v1/health && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/server.log"; exit 1
      - name: Browser end-to-end tests (Chrome is preinstalled on the runner)
        run: npx vitest run --config e2e/vitest.config.mts browser
        env:
          KAIZEN_E2E_BROWSER: /usr/bin/google-chrome

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: web
          push: false
          load: true
          tags: kaizen-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the container
        run: |
          docker run -d --name kaizen -p 127.0.0.1:3100:3000 --read-only --tmpfs /tmp --tmpfs /app/.next/cache \
            --cap-drop ALL --security-opt no-new-privileges -v kaizen-data:/data kaizen-web:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3100/api/v1/health && break; sleep 1; done
          curl -fsS -o /dev/null -w "home %{http_code}\n" http://127.0.0.1:3100/
          curl -fsS -D - -o /dev/null http://127.0.0.1:3100/ | grep -i "content-security-policy: default-src 'self'"
          docker inspect --format '{{.State.Health.Status}} as {{.Config.User}}' kaizen
          docker logs kaizen
