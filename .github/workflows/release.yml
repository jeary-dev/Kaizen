name: Release

# Push a tag like v1.0.0. The tag must match the plugin version in plugin/pom.xml.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  plugin:
    name: Plugin jar and checksum
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Tag matches the plugin version
        working-directory: plugin
        run: |
          version="$(./mvnw -B -q -ntp help:evaluate -Dexpression=project.version -DforceStdout)"
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match pom version $version"; exit 1; }
      - name: Build and test
        working-directory: plugin
        run: ./mvnw -B -ntp verify
      - name: Checksum
        working-directory: plugin/bukkit/target
        run: |
          jar="Kaizen-${GITHUB_REF_NAME#v}.jar"
          sha256sum "$jar" > "$jar.sha256"
          cat "$jar.sha256"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jar="plugin/bukkit/target/Kaizen-${GITHUB_REF_NAME#v}.jar"
          sum="$(cut -d' ' -f1 "$jar.sha256")"
          cat > notes.md <<EOF
          Drop \`Kaizen-${GITHUB_REF_NAME#v}.jar\` into \`plugins/\` and restart. Spigot or Paper 1.20.6 to 1.21.x, Java 21.

          SHA-256: \`$sum\`

          Check it with \`sha256sum -c Kaizen-${GITHUB_REF_NAME#v}.jar.sha256\`.
          EOF
          gh release create "$GITHUB_REF_NAME" "$jar" "$jar.sha256" --title "Kaizen $GITHUB_REF_NAME" --notes-file notes.md --verify-tag

  image:
    name: Web image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/kaizen-web
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
